name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Container image
        run: |
          docker build \
            --build-arg VITE_AL_GORCERIES_2_API_URL=${{ vars.API_URL }} \
            -f Containerfile \
            -t ghcr.io/al-gorceries-2/al-gorceries-2-ui:${{ env.VERSION }} \
            -t ghcr.io/al-gorceries-2/al-gorceries-2-ui:latest \
            .

      - name: Push Container image
        run: |
          docker push ghcr.io/al-gorceries-2/al-gorceries-2-ui:${{ env.VERSION }}
          docker push ghcr.io/al-gorceries-2/al-gorceries-2-ui:latest

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install al-gorceries-2-ui al-gorceries-2-ui-chart --set image.tag=${{ env.VERSION }} --wait
